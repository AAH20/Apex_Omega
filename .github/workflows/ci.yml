name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # apex-os declares requires-python = ">=3.11"; 3.10 can never install it.
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          # Runtime deps the test suite imports at module scope. pytest cannot
          # COLLECT a module whose imports fail, so a missing one presents as a
          # broken test suite. Derived from `grep -rhoE '^(from|import) \w+' tests/`.
          pip install pytest numpy cryptography fakeredis

      - name: Lint with flake8
        # Advisory only. The flags must reach flake8 — `flake8 . || true --count
        # --statistics` passes them to `true`, so flake8 ran bare and its failure
        # was masked.
        run: |
          pip install flake8
          flake8 . --count --statistics --exit-zero

      - name: Test with pytest
        run: |
          pip install pytest
          pytest --tb=short -q